name: cnkav-backend-python

on:
  push:
  pull_request:
    branches:
      - master
    paths:
      - python_backend/**

jobs:
  build:
    runs-on: ubuntu-latest

    # Checks out the entire repo.
    steps:
    - name: Checks out FastAPIOpenAPI
      uses: actions/checkout@v3

    # Generates a openapi.yaml file based on the FastAPI project.
    - name: install python
      uses: actions/setup-python@v3

      with:
        python-version: "3.9"
    - name: Upgrade Pip
      run: python -m pip install --upgrade pip

    - name: Install all dependencies
      run: cd python_backend/ && pip install -r requirements.txt

  deployment:
    runs-on: ubunto-latest
    needs: [build]

    steps:
      - name: Get actions
        uses: actions/checkout@v3

      - name: Deploying to hosting server
        uses: SamKirkland/FTP-Deploy-Action@4.3.1
        with: 
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          port: 22

          sftp: true
